[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctk-idiomas"
version = "0.2.1"
description = "Sistema Plug & Play de idiomas e tradução visual para CustomTkinter"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Lucas Gabriel da Costa" }
]
dependencies = [
    "customtkinter>=5.0.0"
]
